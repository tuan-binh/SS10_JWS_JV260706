spring.application.name=session10

# BÀI TOÁN: quản lý 2 đối tượng gồm danh mục và sản phẩm,
# categories: API lấy danh sách và thêm mới danh mục
# sản phẩm: API lấy danh sách và thêm mới sản phẩm

# Cấu hình kết nối đến database
spring.datasource.url=jdbc:postgresql://localhost:5432/db_session10
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# Cấu hình JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true